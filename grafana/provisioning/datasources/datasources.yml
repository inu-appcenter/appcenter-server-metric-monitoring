apiVersion: 1

# 프로메테우스
datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://appcenter-prometheus:9090
    isDefault: true
    editable: true

  - name: Loki-intip
    type: loki
    access: proxy
    url: http://intip-loki:3100
    editable: true

  - name: Loki-moimi
    uid: inu-teamflow-loki
    type: loki
    access: proxy
    url: http://inu-teamflow-loki:3100
    editable: true

  - name: Loki-unidorm
    uid: unidorm-loki
    type: loki
    access: proxy
    url: http://unidorm-loki:3100
    editable: true

  # Grafana가 prod_gravit-prod, dev_gravit-dev 네트워크에 조인해 있어 컨테이너 이름으로 조회한다.
  - name: Loki-gravit-prod
    uid: gravit-loki-prod
    type: loki
    access: proxy
    url: http://gravit-loki-prod:3100
    editable: true

  - name: Loki-gravit-dev
    uid: gravit-loki-dev
    type: loki
    access: proxy
    url: http://gravit-loki-dev:3100
    editable: true

  - name: Loki-ttok-ttok
